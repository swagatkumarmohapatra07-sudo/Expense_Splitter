<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitMate — Roommate &amp; Friend Expense Splitter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="home">
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">₹</div>
      <div>
        <h1>Split<span>Mate</span></h1>
        <div class="tagline">Roommate &amp; Friend Expense Splitter</div>
      </div>
    </div>
    <div class="user-bar">
      <button class="btn btn-ghost" onclick="resetAll()">Reset All Data</button>
      <span class="user-chip" id="groupChip"></span>
      <span class="user-chip" id="currentUser"></span>
      <button class="btn btn-ghost" onclick="logout()">Log Out</button>
    </div>
    <nav class="nav-bar" id="navBar" aria-label="Navigation">
      <a class="nav-pill" href="index.html" data-page="home">Home</a>
      <a class="nav-pill" href="friends.html" data-page="friends">Friends <span class="nav-count" id="navFriendCount">0</span></a>
      <a class="nav-pill" href="balances.html" data-page="balances">Balances</a>
      <a class="nav-pill" href="history.html" data-page="history">History <span class="nav-count" id="navExpenseCount">0</span></a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <p class="hero-eyebrow" id="homeGroup"></p>
      <h2 class="hero-title">Welcome back, <span id="homeName"></span></h2>
      <p class="hero-sub" id="homeSub"></p>
    </div>
    <div class="hero-actions">
      <a class="btn btn-ghost" href="balances.html">View Balances</a>
      <a class="btn btn-ghost" href="history.html">Full History</a>
    </div>
  </section>

  <div class="grid">

    <!-- LEFT -->
    <div>
      <section class="card">
        <h2>Log an Expense</h2>

        <label for="expDesc">Description</label>
        <input type="text" id="expDesc" placeholder="e.g. Groceries, Wi-Fi, Electricity" maxlength="60" />

        <label for="expAmount">Amount</label>
        <div class="amount-wrap">
          <span class="cur">₹</span>
          <input type="number" id="expAmount" placeholder="0.00" min="0" step="0.01" />
        </div>

        <label for="expDate">Date</label>
        <input type="date" id="expDate" />

        <label for="expPaidBy">Paid By</label>
        <select id="expPaidBy"></select>

        <label>Split Between (or just you)</label>
        <div class="split-list" id="splitList"></div>
        <div class="split-preview" id="splitPreview"></div>

        <button class="btn btn-green" onclick="addExpense()">+ Add Expense</button>
      </section>

      <section class="card">
        <h2>Members <span class="badge" id="friendCount">0</span></h2>
        <div class="friends" id="friendList"></div>
        <a class="btn btn-ghost btn-block" href="friends.html">Manage Friends</a>
      </section>
    </div>

    <!-- RIGHT -->
    <div>
      <section class="card">
        <h2>Overview</h2>
        <div class="sum-strip" id="sumStrip"></div>
        <div class="split-stats" id="splitStats"></div>
      </section>

      <section class="card">
        <h2>Recent Activity</h2>
        <div class="recent-list" id="recentList"></div>
        <a class="btn btn-ghost btn-block" href="history.html">View Full History</a>
      </section>
    </div>

  </div>

  <footer>All data is stored locally in your browser via localStorage.</footer>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
