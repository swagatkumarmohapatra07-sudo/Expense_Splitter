<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitMate — Roommate &amp; Friend Expense Splitter</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-soft: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.12);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.12);
    --radius: 14px;
    --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(34, 197, 94, 0.08), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(239, 68, 68, 0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    padding: 30px 18px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--green), #059669);
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 800;
    color: #052e16;
    box-shadow: var(--shadow);
  }

  h1 { font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--green); }
  .tagline { color: var(--muted); font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 24px;
  }

  .card h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .badge {
    background: var(--card-soft);
    color: var(--green);
    font-size: 12px;
    border-radius: 999px;
    padding: 2px 10px;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 700;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
  }
  input::placeholder { color: var(--muted); }

  .amount-wrap { position: relative; }
  .amount-wrap .cur {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--green);
    font-weight: 700;
    font-size: 16px;
    pointer-events: none;
  }
  .amount-wrap input { padding-left: 34px; }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.08s, filter 0.15s, background 0.15s;
  }
  .btn:active { transform: scale(0.97); }

  .btn-green { background: var(--green); color: #052e16; width: 100%; margin-top: 20px; }
  .btn-green:hover { filter: brightness(1.08); }

  .btn-ghost {
    background: var(--card-soft);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--green); color: var(--green); }

  .btn-icon {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 8px;
    line-height: 1;
  }
  .btn-icon:hover { color: var(--red); background: var(--red-soft); }

  .friends {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
    min-height: 44px;
  }

  .friend-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 8px 7px 14px;
    font-size: 14px;
    font-weight: 600;
    animation: pop 0.2s ease;
  }

  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .friend-tag .initial {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 800;
  }

  .empty {
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    width: 100%;
  }

  .add-row { display: flex; gap: 10px; margin-top: 16px; }
  .add-row input { flex: 1; }
  .add-row .btn { padding: 11px 20px; white-space: nowrap; }

  .split-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-top: 6px;
  }

  .split-item { position: relative; }
  .split-item input { position: absolute; opacity: 0; pointer-events: none; }

  .split-item label {
    margin: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    user-select: none;
    transition: all 0.15s;
  }

  .split-item input:checked + label {
    border-color: var(--green);
    background: var(--green-soft);
    color: var(--green);
    font-weight: 700;
  }

  .balance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  .balance-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .balance-card .name { font-size: 13px; color: var(--muted); font-weight: 600; }
  .balance-card .val { font-size: 18px; font-weight: 800; margin-top: 3px; }

  .pos  { color: var(--green); }
  .neg  { color: var(--red); }
  .zero { color: var(--muted); }

  .settlements { list-style: none; }
  .settlements li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    font-size: 14px;
    animation: pop 0.25s ease;
  }
  .settlements .arrow { color: var(--green); font-weight: 800; }
  .settlements .amnt { margin-left: auto; font-weight: 800; color: var(--green); }

  .table-scroll {
    max-height: 330px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }

  thead th {
    position: sticky;
    top: 0;
    background: var(--card-soft);
    color: var(--muted);
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 12px;
    z-index: 1;
  }

  tbody td { padding: 10px 12px; border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(148, 163, 184, 0.06); }

  .amount-cell { font-weight: 700; }
  .share-list { color: var(--muted); font-size: 13px; }

  .paid-badge {
    background: var(--green-soft);
    color: var(--green);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translate(-50%, 80px);
    background: var(--card-soft);
    border: 1px solid var(--green);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    opacity: 0.8;
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">₹</div>
      <div>
        <h1>Split<span>Mate</span></h1>
        <div class="tagline">Roommate &amp; Friend Expense Splitter</div>
      </div>
    </div>
    <button class="btn btn-ghost" onclick="resetAll()">Reset All Data</button>
  </header>

  <div class="grid">

    <!-- LEFT -->
    <div>
      <section class="card">
        <h2>Friends <span class="badge" id="friendCount">0</span></h2>
        <div class="friends" id="friendList"></div>
        <div class="add-row">
          <input type="text" id="friendName" placeholder="Add a friend (e.g. Rahul)" maxlength="24" />
          <button class="btn btn-ghost" onclick="addFriend()">+ Add</button>
        </div>
      </section>

      <section class="card">
        <h2>Log an Expense</h2>

        <label for="expDesc">Description</label>
        <input type="text" id="expDesc" placeholder="e.g. Groceries, Wi-Fi, Electricity" maxlength="60" />

        <label for="expAmount">Amount</label>
        <div class="amount-wrap">
          <span class="cur">₹</span>
          <input type="number" id="expAmount" placeholder="0.00" min="0" step="0.01" />
        </div>

        <label for="expPaidBy">Paid By</label>
        <select id="expPaidBy"></select>

        <label>Split Between</label>
        <div class="split-list" id="splitList"></div>

        <button class="btn btn-green" onclick="addExpense()">+ Add Expense</button>
      </section>
    </div>

    <!-- RIGHT -->
    <div>
      <section class="card">
        <h2>Net Balances</h2>
        <div class="balance-grid" id="balanceGrid"></div>

        <h2>Settlement Summary</h2>
        <ul class="settlements" id="settlementList"></ul>
      </section>

      <section class="card">
        <h2>Transaction History <span class="badge" id="expenseCount">0</span></h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Paid By</th>
                <th>Split</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </div>

  </div>

  <footer>All data is stored locally in your browser via localStorage.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const FRIENDS_KEY = "splitmate_friends";
  const EXPENSES_KEY = "splitmate_expenses";

  const $ = (id) => document.getElementById(id);

  let friends = [];
  let expenses = [];
  let toastTimer = null;

  const uid = () =>
    (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());

  const fmt = (n) =>
    "₹" + Number(n || 0).toLocaleString("en-IN", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });

  const escapeHtml = (str) =>
    String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  const round2 = (n) => Math.round(n * 100) / 100;

  /* ---------- Persistence ---------- */

  function loadData() {
    try {
      friends = JSON.parse(localStorage.getItem(FRIENDS_KEY)) || [];
      expenses = JSON.parse(localStorage.getItem(EXPENSES_KEY)) || [];
    } catch (e) {
      friends = [];
      expenses = [];
    }
    if (!Array.isArray(friends)) friends = [];
    if (!Array.isArray(expenses)) expenses = [];
  }

  function saveFriends() {
    localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends));
  }

  function saveExpenses() {
    localStorage.setItem(EXPENSES_KEY, JSON.stringify(expenses));
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ---------- Friends ---------- */

  function addFriend() {
    const input = $("friendName");
    const name = input.value.trim().replace(/\s+/g, " ");
    if (!name) {
      toast("Enter a friend's name first.");
      input.focus();
      return;
    }
    if (friends.some((f) => f.name.toLowerCase() === name.toLowerCase())) {
      toast('"' + name + '" is already in the group.');
      return;
    }
    friends.push({ id: uid(), name: name });
    saveFriends();
    input.value = "";
    input.focus();
    renderAll();
    toast(name + " added to the group.");
  }

  function removeFriend(id) {
    const friend = friends.find((f) => f.id === id);
    if (!friend) return;
    const used = expenses.some((e) => e.paidBy === id || e.shares.indexOf(id) !== -1);
    if (used) {
      toast('"' + friend.name + '" is used in expenses. Delete those first.');
      return;
    }
    friends = friends.filter((f) => f.id !== id);
    saveFriends();
    renderAll();
    toast(friend.name + " removed from the group.");
  }

  function renderFriends() {
    const box = $("friendList");
    $("friendCount").textContent = friends.length;
    if (!friends.length) {
      box.innerHTML = '<div class="empty">No friends yet — add someone to start splitting.</div>';
      return;
    }
    box.innerHTML = friends
      .map(
        (f) =>
          '<span class="friend-tag">' +
          '<span class="initial">' + escapeHtml(f.name.charAt(0).toUpperCase()) + "</span>" +
          escapeHtml(f.name) +
          '<button class="btn-icon" title="Remove" onclick="removeFriend(\'' + f.id + '\')">✕</button>' +
          "</span>"
      )
      .join("");
  }

  function renderPaidBy() {
    $("expPaidBy").innerHTML =
      '<option value="">— Select who paid —</option>' +
      friends
        .map((f) => '<option value="' + f.id + '">' + escapeHtml(f.name) + "</option>")
        .join("");
  }

  function renderSplitList() {
    const box = $("splitList");
    if (!friends.length) {
      box.innerHTML = '<div class="empty">Add friends to choose who shares the cost.</div>';
      return;
    }
    box.innerHTML = friends
      .map(
        (f) =>
          '<div class="split-item">' +
          '<input type="checkbox" id="split-' + f.id + '" value="' + f.id + '">' +
          '<label for="split-' + f.id + '">' + escapeHtml(f.name) + "</label>" +
          "</div>"
      )
      .join("");
  }

  /* ---------- Expenses ---------- */

  function addExpense() {
    const desc = $("expDesc").value.trim().replace(/\s+/g, " ");
    const amount = parseFloat($("expAmount").value);
    const paidBy = $("expPaidBy").value;
    const shares = Array.from(
      document.querySelectorAll("#splitList input:checked")
    ).map((cb) => cb.value);

    if (!desc) { toast("Enter a description."); $("expDesc").focus(); return; }
    if (!(amount > 0)) { toast("Enter a valid amount greater than 0."); $("expAmount").focus(); return; }
    if (!paidBy) { toast("Select who paid."); $("expPaidBy").focus(); return; }
    if (!shares.length) { toast("Select at least one person to split with."); return; }

    expenses.push({
      id: uid(),
      desc: desc,
      amount: round2(amount),
      paidBy: paidBy,
      shares: shares,
      date: new Date().toISOString()
    });

    saveExpenses();
    $("expDesc").value = "";
    $("expAmount").value = "";
    $("expPaidBy").value = "";
    document.querySelectorAll("#splitList input:checked").forEach((cb) => (cb.checked = false));
    renderAll();
    toast("Expense added.");
  }

  function removeExpense(id) {
    expenses = expenses.filter((e) => e.id !== id);
    saveExpenses();
    renderAll();
    toast("Expense deleted.");
  }

  function renderHistory() {
    const body = $("historyBody");
    $("expenseCount").textContent = expenses.length;

    if (!expenses.length) {
      body.innerHTML =
        '<tr><td colspan="5"><div class="empty">No expenses yet. Log your first one!</div></td></tr>';
      return;
    }

    body.innerHTML = expenses
      .map((e) => {
        const payer = friends.find((f) => f.id === e.paidBy);
        const payerName = payer ? payer.name : "Unknown";
        const shareNames = e.shares
          .map((id) => {
            const f = friends.find((x) => x.id === id);
            return f ? f.name : "?";
          })
          .join(", ");
        return (
          "<tr>" +
          "<td>" + escapeHtml(e.desc) + "</td>" +
          '<td class="amount-cell">' + fmt(e.amount) + "</td>" +
          '<td><span class="paid-badge">' + escapeHtml(payerName) + "</span></td>" +
          '<td class="share-list">' + escapeHtml(shareNames) + "</td>" +
          '<td style="text-align:right;">' +
          '<button class="btn-icon" title="Delete" onclick="removeExpense(\'' + e.id + '\')">🗑</button>' +
          "</td>" +
          "</tr>"
        );
      })
      .join("");
  }

  /* ---------- Settlement ---------- */

  function computeBalances() {
    const balance = {};
    friends.forEach((f) => (balance[f.id] = 0));

    expenses.forEach((e) => {
      if (balance[e.paidBy] === undefined || !e.shares.length) return;
      const share = round2(e.amount / e.shares.length);
      balance[e.paidBy] = round2(balance[e.paidBy] + e.amount);
      e.shares.forEach((id) => {
        if (balance[id] !== undefined) {
          balance[id] = round2(balance[id] - share);
        }
      });
    });

    const sum = round2(Object.values(balance).reduce((a, b) => a + b, 0));
    if (Math.abs(sum) > 0.004) {
      const payer = friends.find((f) => balance[f.id] !== 0);
      if (payer) balance[payer.id] = round2(balance[payer.id] - sum);
    }

    return balance;
  }

  function computeSettlements(balance) {
    const debtors = Object.keys(balance)
      .map((id) => ({ id, amt: -balance[id] }))
      .filter((d) => d.amt > 0.004)
      .sort((a, b) => b.amt - a.amt);

    const creditors = Object.keys(balance)
      .map((id) => ({ id, amt: balance[id] }))
      .filter((c) => c.amt > 0.004)
      .sort((a, b) => b.amt - a.amt);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amt, creditors[j].amt);
      transfers.push({
        from: debtors[i].id,
        to: creditors[j].id,
        amount: round2(pay)
      });
      debtors[i].amt = round2(debtors[i].amt - pay);
      creditors[j].amt = round2(creditors[j].amt - pay);
      if (debtors[i].amt <= 0.004) i++;
      if (creditors[j].amt <= 0.004) j++;
    }
    return transfers;
  }

  function renderSettlements() {
    const grid = $("balanceGrid");
    const list = $("settlementList");

    if (!friends.length) {
      grid.innerHTML = '<div class="empty">Add friends to see balances.</div>';
      list.innerHTML = '<div class="empty">Nothing to settle yet.</div>';
      return;
    }

    const balance = computeBalances();

    grid.innerHTML = friends
      .map((f) => {
        const b = round2(balance[f.id] || 0);
        const cls = b > 0.004 ? "pos" : b < -0.004 ? "neg" : "zero";
        const sign = b > 0 ? "+" : "";
        return (
          '<div class="balance-card">' +
          '<div class="name">' + escapeHtml(f.name) + "</div>" +
          '<div class="val ' + cls + '">' + sign + fmt(b) + "</div>" +
          "</div>"
        );
      })
      .join("");

    const transfers = computeSettlements(balance);

    if (!transfers.length) {
      list.innerHTML = '<div class="empty">All settled up — no one owes anyone.</div>';
      return;
    }

    list.innerHTML = transfers
      .map((t) => {
        const from = friends.find((f) => f.id === t.from);
        const to = friends.find((f) => f.id === t.to);
        return (
          "<li>" +
          "<strong>" + escapeHtml(from ? from.name : "?") + "</strong>" +
          '<span class="arrow">owes →</span>' +
          "<strong>" + escapeHtml(to ? to.name : "?") + "</strong>" +
          '<span class="amnt">' + fmt(t.amount) + "</span>" +
          "</li>"
        );
      })
      .join("");
  }

  /* ---------- Wiring ---------- */

  function renderAll() {
    renderFriends();
    renderPaidBy();
    renderSplitList();
    renderHistory();
    renderSettlements();
  }

  function resetAll() {
    if (!confirm("Remove ALL friends and expenses? This cannot be undone.")) return;
    friends = [];
    expenses = [];
    saveFriends();
    saveExpenses();
    renderAll();
    toast("All data cleared.");
  }

  $("friendName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addFriend();
  });
  $("expDesc").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addExpense();
  });

  window.addFriend = addFriend;
  window.removeFriend = removeFriend;
  window.addExpense = addExpense;
