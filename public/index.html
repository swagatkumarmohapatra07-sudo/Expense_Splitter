<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevVault &mdash; Snippet &amp; Note Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">&#128274;</span>
      <div>
        <h1>DevVault</h1>
        <p>Store, tag, copy &amp; search code snippets and study notes.</p>
      </div>
    </div>
    <div class="stats" id="stats">
      <span id="totalCount" class="stat-pill">0 snippets</span>
    </div>
  </header>

  <main class="app-main">
    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search snippets, tags, code&hellip;"
        autocomplete="off"
      />
      <button id="addBtn" class="btn btn-primary" type="button">+ New Snippet</button>
    </section>

    <nav class="filter-bar" id="filterBar" aria-label="Category filters">
      <button class="filter-pill active" data-category="" type="button">All</button>
    </nav>

    <section id="grid" class="snippet-grid" aria-live="polite">
      <p id="emptyState" class="empty-state hidden">
        No snippets found. Create your first one!
      </p>
    </section>
  </main>

  <dialog id="modal" class="modal">
    <form id="snippetForm" class="modal-card" method="dialog">
      <div class="modal-header">
        <h2 id="modalTitle">New Snippet</h2>
        <button type="button" id="closeModalBtn" class="modal-close" aria-label="Close">&times;</button>
      </div>

      <input type="hidden" id="snippetId" />

      <label class="field">
        <span>Title *</span>
        <input type="text" id="titleInput" required maxlength="120" placeholder="e.g. Debounce Function" />
      </label>

      <div class="field-row">
        <label class="field">
          <span>Category *</span>
          <select id="categorySelect" required>
            <option value="">Select category&hellip;</option>
            <option value="javascript">JavaScript</option>
            <option value="nodejs">Node.js</option>
            <option value="css">CSS</option>
            <option value="html">HTML</option>
            <option value="sql">SQL</option>
            <option value="study">Study Notes</option>
          </select>
        </label>
        <label class="field">
          <span>Tags</span>
          <input type="text" id="tagsInput" placeholder="comma, separated, tags" />
        </label>
      </div>

      <label class="field">
        <span>Description</span>
        <input type="text" id="descriptionInput" maxlength="300" placeholder="What does this snippet do?" />
      </label>

      <label class="field">
        <span>Code *</span>
        <textarea id="codeInput" required rows="8" spellcheck="false" placeholder="Paste your code here&hellip;"></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="saveBtn" class="btn btn-primary">Save Snippet</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <span class="category-badge"></span>
        <span class="card-date"></span>
      </div>
      <h3 class="card-title"></h3>
      <p class="card-desc"></p>
      <pre class="code-block"><code class="code-text"></code></pre>
      <div class="card-tags"></div>
      <div class="card-actions">
        <button type="button" class="btn btn-sm copy-btn">Copy</button>
        <button type="button" class="btn btn-sm btn-ghost edit-btn">Edit</button>
        <button type="button" class="btn btn-sm btn-danger delete-btn">Delete</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
