<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>History — SplitMate</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="history">
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">₹</div>
      <div>
        <h1>Split<span>Mate</span></h1>
        <div class="tagline">Roommate &amp; Friend Expense Splitter</div>
      </div>
    </div>
    <div class="user-bar">
      <button class="btn btn-ghost" onclick="resetAll()">Reset All Data</button>
      <span class="user-chip" id="groupChip"></span>
      <span class="user-chip" id="currentUser"></span>
      <button class="btn btn-ghost" onclick="logout()">Log Out</button>
    </div>
    <nav class="nav-bar" id="navBar" aria-label="Navigation">
      <a class="nav-pill" href="index.html" data-page="home">Home</a>
      <a class="nav-pill" href="friends.html" data-page="friends">Friends <span class="nav-count" id="navFriendCount">0</span></a>
      <a class="nav-pill" href="balances.html" data-page="balances">Balances</a>
      <a class="nav-pill" href="history.html" data-page="history">History <span class="nav-count" id="navExpenseCount">0</span></a>
    </nav>
  </header>

  <section class="card">
    <h2>Transaction History <span class="badge" id="expenseCount">0</span></h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
          <th>Description</th>
          <th>Date</th>
          <th>Amount</th>
          <th>Paid By</th>
          <th>Split</th>
          <th>Status</th>
          <th></th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

  <footer>All data is stored locally in your browser via localStorage.</footer>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
